name: Vérification du build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          if ! npm run build > build.log 2>&1; then
            # Résumé de l'erreur visible dans les annotations du job
            tail -n 80 build.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > summary.txt
            echo "::error title=Build::$(cat summary.txt)"
            exit 1
          fi
          tail -n 40 build.log
      - run: npm run test:tele
